<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PagePulse Monitor</title>
<style>
  :root{--ink:#202b28;--green:#277258;--orange:#e8734c;--sidebar:#172824;--line:#e6e9e4;--bg:#f8f9f6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);width:330px;font-size:13px}
  .header{background:var(--sidebar);color:#e9efe9;padding:16px 18px;display:flex;align-items:center;gap:10px}
  .brand-icon{background:#dcecce;color:#1c3328;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:7px;font-family:Georgia;font-style:italic;font-size:20px;position:relative}
  .brand-icon::after{content:'•';position:absolute;right:-2px;top:-3px;font-size:13px;color:#e8734c;font-style:normal}
  .brand-name{font-size:18px;font-weight:700;letter-spacing:-0.8px}
  .brand-dot{color:#e59a77}
  .body{padding:18px}
  .page-title{font-size:10px;color:#8a9288;letter-spacing:0.5px;margin-bottom:4px;text-transform:uppercase}
  .page-url{font-size:12px;font-weight:550;word-break:break-all;color:#202b28;margin-bottom:16px;background:white;border:1px solid var(--line);border-radius:5px;padding:8px 10px}
  .field{margin-bottom:12px}
  .field label{font-size:11px;font-weight:600;display:block;margin-bottom:5px;color:#4a5c4e}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px 10px;background:#fff;font-size:12px;color:#202b28;font-family:inherit}
  .field input:focus,.field select:focus{outline:2px solid #a6c6ac;outline-offset:1px}
  .server-row{display:flex;gap:6px;margin-bottom:14px}
  .server-row input{flex:1}
  .server-row button{background:var(--sidebar);color:#fff;border:0;border-radius:5px;padding:0 12px;font-size:11px;cursor:pointer;white-space:nowrap}
  .server-row button:hover{background:#243f30}
  .btn{width:100%;background:var(--orange);color:white;border:0;border-radius:6px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.2px}
  .btn:hover{background:#dc6944}.btn:disabled{opacity:0.5;cursor:wait}
  .btn svg{width:15px;height:15px}
  .status{margin-top:12px;font-size:11px;border-radius:5px;padding:9px 11px;display:none}
  .status.ok{background:#edf5ed;color:#3d6b47;display:block}
  .status.err{background:#fcf0e9;color:#a04831;display:block}
  .open-link{display:block;text-align:center;margin-top:10px;font-size:10px;color:#8a9288;text-decoration:none}
  .open-link:hover{color:var(--orange)}
  .divider{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="header">
  <span class="brand-icon">p</span>
  <span class="brand-name">pagepulse<span class="brand-dot">.</span></span>
</div>
<div class="body">
  <div class="page-title">Current page</div>
  <div class="page-url" id="current-url">Loading…</div>

  <div class="server-row">
    <input type="url" id="server-url" placeholder="http://localhost:3000" title="PagePulse server URL">
    <button id="save-server">Save</button>
  </div>

  <div class="field">
    <label for="monitor-name">Monitor name</label>
    <input id="monitor-name" type="text" placeholder="e.g. My page monitor" maxlength="100">
  </div>
  <div class="field">
    <label for="monitor-interval">Check every</label>
    <select id="monitor-interval">
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="60" selected>1 hour</option>
      <option value="180">3 hours</option>
      <option value="360">6 hours</option>
      <option value="720">12 hours</option>
      <option value="1440">24 hours</option>
    </select>
  </div>

  <button class="btn" id="add-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"/></svg>
    Add to PagePulse
  </button>

  <div class="status" id="status"></div>
  <a class="open-link" id="open-dashboard" href="#" target="_blank" rel="noreferrer">Open PagePulse dashboard ↗</a>
</div>
<script src="popup.js"></script>
</body>
</html>
